<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BD3 - Atividade 4 | Alunos (Firestore)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Cadastro de Alunos</h1>
    <p class="sub">Firestore Database · coleção <strong>BD3-NoSQL-Firestore</strong></p>
    <p id="status" class="status">Conectando ao Firebase...</p>

    <form id="form-aluno" class="card">
      <h2>Inserir aluno</h2>
      <div class="grid">
        <label>Nome
          <input type="text" id="nome" maxlength="100" required />
        </label>
        <label>CPF (só números)
          <input type="text" id="cpf" maxlength="11" pattern="\d{11}" required />
        </label>
        <label>RG (só números)
          <input type="text" id="rg" maxlength="9" required />
        </label>
        <label>Telefone do aluno
          <input type="tel" id="telefone_aluno" maxlength="11" required />
        </label>
        <label>Telefone do responsável
          <input type="tel" id="telefone_responsavel" maxlength="11" required />
        </label>
        <label>E-mail
          <input type="email" id="email" maxlength="100" required />
        </label>
        <label>Data de nascimento
          <input type="date" id="data_nascimento" required />
        </label>
      </div>
      <button type="submit">Salvar aluno</button>
    </form>

    <section class="card">
      <div class="head">
        <h2>Alunos cadastrados</h2>
        <button id="btn-listar" type="button" class="secondary">Atualizar lista</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Nome</th><th>CPF</th><th>RG</th><th>Tel. aluno</th>
              <th>Tel. resp.</th><th>E-mail</th><th>Nascimento</th><th></th>
            </tr>
          </thead>
          <tbody id="lista"></tbody>
        </table>
      </div>
      <p id="vazio" class="vazio" hidden>Nenhum aluno cadastrado.</p>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
